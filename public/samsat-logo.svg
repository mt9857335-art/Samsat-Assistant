<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Metallic Gold Linear Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA4" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="75%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>

    <!-- Bright Gold Highlight Gradient -->
    <linearGradient id="goldBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF5C2" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Deep Gold Shadow Gradient -->
    <linearGradient id="goldDeep" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F5DE88" />
      <stop offset="50%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8C6313" />
    </linearGradient>

    <!-- Soft Golden Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Double Golden Circular Ring -->
  <circle cx="250" cy="250" r="232" stroke="url(#goldMetallic)" stroke-width="7" filter="url(#goldGlow)" />
  <circle cx="250" cy="250" r="222" stroke="url(#goldBright)" stroke-width="1.8" opacity="0.8" />

  <!-- SATELLITE DISH & SIGNAL WAVES -->
  <g id="satellite-group" filter="url(#goldGlow)">
    <!-- Mounting Bracket / Pedestal -->
    <!-- Base Plate -->
    <path d="M 216 226 L 254 226 L 250 231 L 220 231 Z" fill="url(#goldDeep)" />
    <!-- Stand Struts -->
    <path d="M 226 226 L 235 204 L 244 204 L 246 226 Z" fill="url(#goldMetallic)" />
    <path d="M 233 204 L 247 204 L 244 196 L 230 196 Z" fill="url(#goldBright)" />

    <!-- Satellite Dish Parabolic Bowl -->
    <!-- Outer bowl lip -->
    <path d="M 204 186 C 196 156, 218 130, 252 128 C 272 126, 290 137, 296 153 C 286 142, 268 135, 248 137 C 220 140, 203 162, 208 186 Z" fill="url(#goldBright)" />
    <!-- Main Parabolic Ellipse Body -->
    <ellipse cx="252" cy="164" rx="46" ry="24" transform="rotate(-30 252 164)" stroke="url(#goldMetallic)" stroke-width="5.5" fill="none" />
    <ellipse cx="252" cy="164" rx="42" ry="20" transform="rotate(-30 252 164)" stroke="url(#goldDeep)" stroke-width="2" fill="none" opacity="0.6" />

    <!-- Central Feed Horn & Support Arms -->
    <!-- Support arm to focal point -->
    <line x1="250" y1="166" x2="276" y2="136" stroke="url(#goldMetallic)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="228" y1="178" x2="276" y2="136" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Feedhorn Head (Focal Receiver) -->
    <circle cx="276" cy="136" r="4.5" fill="url(#goldBright)" />
    <path d="M 273 133 L 282 126 L 286 130 L 278 138 Z" fill="url(#goldMetallic)" />

    <!-- Radio / Satellite Signal Waves (3 Concentric Radiating Arcs) -->
    <!-- Wave 1 (Inner) -->
    <path d="M 288 126 C 293 121, 298 120, 303 124" stroke="url(#goldBright)" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Wave 2 (Middle) -->
    <path d="M 293 118 C 302 110, 310 110, 317 116" stroke="url(#goldMetallic)" stroke-width="3.2" stroke-linecap="round" fill="none" />
    <!-- Wave 3 (Outer) -->
    <path d="M 298 110 C 312 98, 323 100, 332 108" stroke="url(#goldBright)" stroke-width="3.5" stroke-linecap="round" fill="none" />

    <!-- Decorative Stars & Sparkles -->
    <!-- Sparkle Left (4-Point Star) -->
    <path d="M 188 152 Q 188 160 196 160 Q 188 160 188 168 Q 188 160 180 160 Q 188 160 188 152 Z" fill="url(#goldBright)" />
    <!-- Tiny Sparkle Dot Upper Left -->
    <circle cx="196" cy="138" r="2.2" fill="url(#goldBright)" />
    <!-- Sparkle Right (4-Point Star) -->
    <path d="M 334 162 Q 334 168 340 168 Q 334 168 334 174 Q 334 168 328 168 Q 334 168 334 162 Z" fill="url(#goldBright)" />
    <!-- Tiny Sparkle Dot Upper Right -->
    <circle cx="342" cy="144" r="1.8" fill="url(#goldBright)" />
  </g>

  <!-- BRAND NAME: SAM SAT -->
  <g id="brand-text" filter="url(#goldGlow)">
    <text x="250" y="278" 
          text-anchor="middle" 
          font-family="'Times New Roman', 'Cinzel', 'Georgia', serif" 
          font-size="49" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#goldMetallic)">
      SAM SAT
    </text>
  </g>

  <!-- SUBTITLE: PREMIUM SATELLITE SOLUTIONS -->
  <g id="subtitle-text">
    <text x="250" y="307" 
          text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Arial', sans-serif" 
          font-size="13.2" 
          font-weight="700" 
          letter-spacing="3.2" 
          fill="url(#goldBright)">
      PREMIUM SATELLITE SOLUTIONS
    </text>
  </g>

  <!-- DIVIDER WITH 4-POINT STAR ORNAMENT -->
  <g id="divider-ornament">
    <line x1="168" y1="324" x2="234" y2="324" stroke="url(#goldMetallic)" stroke-width="1.8" stroke-linecap="round" />
    <!-- Center 4-pointed diamond star -->
    <path d="M 250 318 L 253.5 324 L 259 324 L 254.5 327 L 256.5 332 L 250 328.5 L 243.5 332 L 245.5 327 L 241 324 L 246.5 324 Z" fill="url(#goldBright)" />
    <line x1="266" y1="324" x2="332" y2="324" stroke="url(#goldMetallic)" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- PHONE NUMBER WITH BULLETS: • 71186492 • -->
  <g id="phone-number" filter="url(#goldGlow)">
    <text x="250" y="367" 
          text-anchor="middle" 
          font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" 
          font-size="30" 
          font-weight="800" 
          letter-spacing="4" 
          fill="url(#goldMetallic)">
      • 71186492 •
    </text>
  </g>
</svg>
